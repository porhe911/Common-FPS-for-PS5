name: v0.28b SR3 V5 ModuleList DMAP

on:
  workflow_dispatch:
  push:
    branches:
      - "v028b-stable-source-rebuild"
    paths:
      - "src/ps5/legacy_v028b/**"
      - "ps5/V028BRebuild.cmake"
      - "scripts/v028b_sr3_build.sh"
      - ".github/workflows/v028b-sr3.yml"
      - "tools/make_etahen_plugin.py"

jobs:
  build-sr3:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Common FPS
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget unzip cmake meson pkg-config python3 python3-pyelftools clang-18 lld-18 binutils

      - name: Prepare pinned PS5 source dependencies
        run: bash ./scripts/prepare_ps5_deps.sh

      - name: Host regression tests
        run: |
          cmake -S . -B build-host -DCMAKE_BUILD_TYPE=Release
          cmake --build build-host -j2
          ctest --test-dir build-host --output-on-failure

      - name: Build SR3 v5 module-list DMAP probe
        run: bash ./scripts/v028b_sr3_build.sh

      - name: Upload SR3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Common-FPS-v028b-SR3-V5-ModuleList-DMAP
          path: |
            dist/v028b-sr3/Common_FPS_SR3_v028b_V5_ModuleList_DMAP.elf
            dist/v028b-sr3/Common_FPS_SR3_v028b_V5_ModuleList_DMAP_etaHEN.plugin
            dist/v028b-sr3/SHA256SUMS.txt
            dist/v028b-sr3/LINKED_SYMBOLS.txt
          if-no-files-found: error
