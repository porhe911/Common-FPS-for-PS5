name: v0.28b SR9F Enqueue Execution

on:
  workflow_dispatch:
  push:
    branches:
      - "v028b-stable-source-rebuild"
    paths:
      - "src/ps5/legacy_v028b/sr9f_enqueue_execution_receiver.c"
      - "src/ps5/legacy_v028b/sr9f_enqueue_execution_bootstrap_probe.cpp"
      - "ps5/sr9f/CMakeLists.txt"
      - "scripts/v028b_sr9f_build.sh"
      - ".github/workflows/v028b-sr9f.yml"
      - "src/ps5/legacy_v028b/stable_injector.cpp"
      - "src/ps5/legacy_v028b/pt_call_breakpoint.cpp"
      - "src/ps5/legacy_v028b/libnines_elfldr_trace_bridge.c"
      - "src/ps5/legacy_v028b/process_sysctl.cpp"
      - "tools/embed_binary_cpp.py"
      - "tools/make_etahen_plugin.py"

jobs:
  build-sr9f:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Common FPS
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget unzip cmake meson pkg-config python3 python3-pyelftools clang-18 lld-18 binutils
      - name: Prepare pinned PS5 source dependencies
        run: bash ./scripts/prepare_ps5_deps.sh
      - name: Host regression tests
        run: |
          cmake -S . -B build-host -DCMAKE_BUILD_TYPE=Release
          cmake --build build-host -j2
          ctest --test-dir build-host --output-on-failure
      - name: Build SR9F enqueue execution probe
        run: bash ./scripts/v028b_sr9f_build.sh
      - name: Upload SR9F artifact
        uses: actions/upload-artifact@v4
        with:
          name: Common-FPS-v028b-SR9F-Enqueue-Execution
          path: |
            dist/v028b-sr9f/Common_FPS_SR9F_Enqueue_Execution_Receiver.elf
            dist/v028b-sr9f/Common_FPS_SR9F_v028b_Enqueue_Execution.elf
            dist/v028b-sr9f/Common_FPS_SR9F_v028b_Enqueue_Execution_etaHEN.plugin
            dist/v028b-sr9f/SHA256SUMS.txt
            dist/v028b-sr9f/LINKED_SYMBOLS.txt
            dist/v028b-sr9f/RECEIVER_GLOB_DAT.txt
          if-no-files-found: error
