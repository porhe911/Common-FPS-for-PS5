name: Host Source Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j2

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: v1.0.0 parity / autoload source gate
        run: python3 tools/check_v1_source_gate.py

      - name: etaHEN wrapper test
        run: python3 tests/test_plugin_wrapper.py

      - name: Install pinned browser test tools
        run: |
          npm install --prefix build-ui --no-save playwright@1.62.1
          ./build-ui/node_modules/.bin/playwright install --with-deps chromium

      - name: Settings UI with the real HTTP worker
        env:
          NODE_PATH: ${{ github.workspace }}/build-ui/node_modules
        run: node tests/test_settings_ui.js ./build/common_fps_settings_server ./build/settings-preview.png

      - name: Upload settings preview
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Common-FPS-v1.2.3-settings-preview
          path: build/settings-preview.png
