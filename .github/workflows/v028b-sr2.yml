name: v0.28b SR2 Auth DMAP

on:
  workflow_dispatch:
  push:
    branches:
      - "v028b-stable-source-rebuild"
    paths:
      - "src/ps5/legacy_v028b/**"
      - "ps5/V028BRebuild.cmake"
      - "scripts/v028b_sr2_build.sh"
      - ".github/workflows/v028b-sr2.yml"
      - "tools/make_etahen_plugin.py"

jobs:
  build-sr2:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Common FPS
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget unzip cmake meson pkg-config python3 python3-pyelftools clang-18 lld-18 binutils

      - name: Prepare pinned PS5 source dependencies
        run: bash ./scripts/prepare_ps5_deps.sh

      - name: Host regression tests
        run: |
          cmake -S . -B build-host -DCMAKE_BUILD_TYPE=Release
          cmake --build build-host -j2
          ctest --test-dir build-host --output-on-failure

      - name: Build SR2 short-auth DMAP probe
        run: bash ./scripts/v028b_sr2_build.sh

      - name: Upload SR2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Common-FPS-v028b-SR2-Auth-DMAP
          path: |
            dist/v028b-sr2/Common_FPS_SR2_v028b_Auth_DMAP.elf
            dist/v028b-sr2/Common_FPS_SR2_v028b_Auth_DMAP_etaHEN.plugin
            dist/v028b-sr2/SHA256SUMS.txt
            dist/v028b-sr2/LINKED_SYMBOLS.txt
          if-no-files-found: error
