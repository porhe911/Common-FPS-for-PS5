name: v0.28b SR5 DMAP Stage Trace

on:
  workflow_dispatch:
  push:
    branches:
      - "v028b-stable-source-rebuild"
    paths:
      - "src/ps5/legacy_v028b/**"
      - "ps5/V028BRebuild.cmake"
      - "scripts/v028b_sr5_build.sh"
      - ".github/workflows/v028b-sr5.yml"
      - "tools/make_etahen_plugin.py"

jobs:
  build-sr5:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Common FPS
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget unzip cmake meson pkg-config python3 python3-pyelftools clang-18 lld-18 binutils

      - name: Prepare pinned PS5 source dependencies
        run: bash ./scripts/prepare_ps5_deps.sh

      - name: Host regression tests
        run: |
          cmake -S . -B build-host -DCMAKE_BUILD_TYPE=Release
          cmake --build build-host -j2
          ctest --test-dir build-host --output-on-failure

      - name: Build SR5 DMAP stage trace probe
        run: bash ./scripts/v028b_sr5_build.sh

      - name: Upload SR5 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Common-FPS-v028b-SR5-DMAP-Stage-Trace
          path: |
            dist/v028b-sr5/Common_FPS_SR5_v028b_DMAP_Stage_Trace.elf
            dist/v028b-sr5/Common_FPS_SR5_v028b_DMAP_Stage_Trace_etaHEN.plugin
            dist/v028b-sr5/SHA256SUMS.txt
            dist/v028b-sr5/LINKED_SYMBOLS.txt
          if-no-files-found: error
