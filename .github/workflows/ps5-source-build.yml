name: PS5 Source Build

on:
  workflow_dispatch:
  push:
    branches:
      - "fw960-stageb-v11"
    tags:
      - "v1.1.0-rc*"
      - "v1.1.0"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Common FPS
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git wget unzip cmake meson pkg-config \
            python3 python3-pyelftools \
            clang-18 lld-18 xxd

      - name: Prepare pinned PS5 source dependencies
        run: bash ./scripts/prepare_ps5_deps.sh

      - name: Host regression tests
        run: |
          cmake -S . -B build-host -DCMAKE_BUILD_TYPE=Release
          cmake --build build-host -j2
          ctest --test-dir build-host --output-on-failure

      - name: Build RC7 one-shot sysctl PS5 ELF and etaHEN plugin
        run: bash ./scripts/ps5_source_build.sh

      - name: Upload PS5 build
        uses: actions/upload-artifact@v4
        with:
          name: Common-FPS-RC7-Sysctl-Once
          path: |
            dist/Common_FPS_RC7_Sysctl_Once.elf
            dist/Common_FPS_RC7_Sysctl_Once_etaHEN.plugin
            dist/SHA256SUMS.txt
            RESOLVED_BUILD_DEPENDENCIES.txt
          if-no-files-found: error
