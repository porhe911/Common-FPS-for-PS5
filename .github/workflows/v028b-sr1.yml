name: v0.28b SR1 Backend Parity

on:
  workflow_dispatch:
  push:
    branches:
      - "v028b-stable-source-rebuild"
    paths:
      - "src/ps5/legacy_v028b/**"
      - "ps5/V028BRebuild.cmake"
      - "scripts/v028b_sr1_build.sh"
      - ".github/workflows/v028b-sr1.yml"
      - "tools/make_etahen_plugin.py"

jobs:
  build-sr1:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Common FPS
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git wget unzip cmake meson pkg-config \
            python3 python3-pyelftools \
            clang-18 lld-18 binutils

      - name: Prepare pinned PS5 source dependencies
        run: bash ./scripts/prepare_ps5_deps.sh

      - name: Host regression tests
        run: |
          cmake -S . -B build-host -DCMAKE_BUILD_TYPE=Release
          cmake --build build-host -j2
          ctest --test-dir build-host --output-on-failure

      - name: Build SR1 recovered v0.28b backend probe
        run: bash ./scripts/v028b_sr1_build.sh

      - name: Upload SR1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Common-FPS-v028b-SR1-Backend-Parity
          path: |
            dist/v028b-sr1/Common_FPS_SR1_v028b_Backend.elf
            dist/v028b-sr1/Common_FPS_SR1_v028b_Backend_etaHEN.plugin
            dist/v028b-sr1/SHA256SUMS.txt
            dist/v028b-sr1/SYMBOLS.txt
            docs/V028B_BINARY_FORENSICS.md
            RESOLVED_BUILD_DEPENDENCIES.txt
          if-no-files-found: error
