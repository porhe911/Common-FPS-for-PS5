name: v0.28b SR9C Dispatcher Discovery

on:
  workflow_dispatch:
  push:
    branches:
      - "v028b-stable-source-rebuild"
    paths:
      - "src/ps5/legacy_v028b/sr9c_dispatcher_discovery_receiver.c"
      - "src/ps5/legacy_v028b/sr9c_dispatcher_discovery_bootstrap_probe.cpp"
      - "ps5/sr9c/CMakeLists.txt"
      - "scripts/v028b_sr9c_build.sh"
      - ".github/workflows/v028b-sr9c.yml"
      - "src/ps5/legacy_v028b/stable_injector.cpp"
      - "src/ps5/legacy_v028b/pt_call_breakpoint.cpp"
      - "src/ps5/legacy_v028b/libnines_elfldr_trace_bridge.c"
      - "src/ps5/legacy_v028b/process_sysctl.cpp"
      - "tools/embed_binary_cpp.py"
      - "tools/make_etahen_plugin.py"

jobs:
  build-sr9c:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Common FPS
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget unzip cmake meson pkg-config python3 python3-pyelftools clang-18 lld-18 binutils

      - name: Prepare pinned PS5 source dependencies
        run: bash ./scripts/prepare_ps5_deps.sh

      - name: Host regression tests
        run: |
          cmake -S . -B build-host -DCMAKE_BUILD_TYPE=Release
          cmake --build build-host -j2
          ctest --test-dir build-host --output-on-failure

      - name: Build SR9C dispatcher discovery probe
        run: bash ./scripts/v028b_sr9c_build.sh

      - name: Upload SR9C artifact
        uses: actions/upload-artifact@v4
        with:
          name: Common-FPS-v028b-SR9C-Dispatcher-Discovery
          path: |
            dist/v028b-sr9c/Common_FPS_SR9C_Dispatcher_Discovery_Receiver.elf
            dist/v028b-sr9c/Common_FPS_SR9C_v028b_Dispatcher_Discovery.elf
            dist/v028b-sr9c/Common_FPS_SR9C_v028b_Dispatcher_Discovery_etaHEN.plugin
            dist/v028b-sr9c/SHA256SUMS.txt
            dist/v028b-sr9c/LINKED_SYMBOLS.txt
            dist/v028b-sr9c/RECEIVER_GLOB_DAT.txt
          if-no-files-found: error
