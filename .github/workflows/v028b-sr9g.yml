name: v0.28b SR9G Native Action Queue Proof

on:
  workflow_dispatch:
  push:
    branches:
      - "v028b-stable-source-rebuild"
    paths:
      - "src/ps5/legacy_v028b/sr9g_native_action_receiver.c"
      - "src/ps5/legacy_v028b/sr9g_native_action_bootstrap_probe.cpp"
      - "ps5/sr9g/CMakeLists.txt"
      - "scripts/v028b_sr9g_build.sh"
      - ".github/workflows/v028b-sr9g.yml"
      - "src/ps5/legacy_v028b/stable_injector.cpp"
      - "src/ps5/legacy_v028b/pt_call_breakpoint.cpp"
      - "src/ps5/legacy_v028b/libnines_elfldr_trace_bridge.c"
      - "src/ps5/legacy_v028b/process_sysctl.cpp"
      - "tools/embed_binary_cpp.py"
      - "tools/make_etahen_plugin.py"

jobs:
  build-sr9g:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Common FPS
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget unzip cmake meson pkg-config python3 python3-pyelftools clang-18 lld-18 binutils
      - name: Prepare pinned PS5 source dependencies
        run: bash ./scripts/prepare_ps5_deps.sh
      - name: Host regression tests
        run: |
          cmake -S . -B build-host -DCMAKE_BUILD_TYPE=Release
          cmake --build build-host -j2
          ctest --test-dir build-host --output-on-failure
      - name: Build SR9G native Action queue proof
        run: bash ./scripts/v028b_sr9g_build.sh
      - name: Upload SR9G artifact
        uses: actions/upload-artifact@v4
        with:
          name: Common-FPS-v028b-SR9G-Native-Action
          path: |
            dist/v028b-sr9g/Common_FPS_SR9G_Native_Action_Receiver.elf
            dist/v028b-sr9g/Common_FPS_SR9G_v028b_Native_Action.elf
            dist/v028b-sr9g/Common_FPS_SR9G_v028b_Native_Action_etaHEN.plugin
            dist/v028b-sr9g/SHA256SUMS.txt
            dist/v028b-sr9g/LINKED_SYMBOLS.txt
            dist/v028b-sr9g/RECEIVER_GLOB_DAT.txt
          if-no-files-found: error
